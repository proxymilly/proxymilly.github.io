<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROXYMILLY — Built Different</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #080808;
  color: #fff;
  text-align: center;
}

header {
  padding: 45px 20px 30px;
  border-bottom: 1px solid #2b2415;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 5px;
}

.gold {
  color: #d4af37;
}

.tagline {
  margin-top: 10px;
  color: #aaa;
  letter-spacing: 2px;
}

.hero {
  padding: 45px 20px 30px;
}

.hero h1 {
  font-size: 38px;
  margin-bottom: 12px;
}

.hero p {
  color: #aaa;
  line-height: 1.6;
}

.products {
  max-width: 950px;
  margin: 20px auto 60px;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
}

.product-card {
  background: #111;
  border: 1px solid #2b2415;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(212,175,55,0.12);
}

.product-card img {
  width: 100%;
  display: block;
}

.product-info {
  padding: 22px 18px 25px;
  border-top: 1px solid #2b2415;
}

.product-info h2 {
  color: #fff;
  font-size: 19px;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.product-info p {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 12px;
}

.price {
  color: #d4af37;
  font-size: 25px;
  font-weight: bold;
  margin: 15px 0 20px;
}

.order {
  display: block;
  background: #d4af37;
  color: #080808;
  padding: 14px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
}

.order:hover {
  background: #fff;
}

footer {
  border-top: 1px solid #2b2415;
  padding: 30px 20px;
  color: #777;
  font-size: 14px;
}

footer strong {
  color: #d4af37;
}

@media (max-width: 700px) {

  .products {
    grid-template-columns: 1fr;
    padding: 15px;
  }

  .hero h1 {
    font-size: 32px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    <span class="gold">PROXY</span>MILLY
  </div>

    CREATE • INSPIRE • MOTIVATE
  </div>

</header>


<section class="hero">

  <h1>BUILT DIFFERENT.</h1>

  <p>
    Premium streetwear from Okeho to the world.<br>
    One brand. Endless impact.
  </p>

</section>


<section class="products">


  <!-- PRODUCT 1 -->

  <div class="product-card">

    <img
      src="proxymilly_front_back.jpg"
      alt="Proxymilly Front and Back Classic Edition"
    >

    <div class="product-info">

      <h2>PROXYMILLY - FRONT & BACK</h2>

      <p>
        CLASSIC EDITION
      </p>

        ₦15,000
      </div>

        href="https://wa.me/2348165155009?text=Hello%20Proxymilly%2C%20I%20want%20the%20Front%20%26%20Back%20Classic%20Edition%20for%20%E2%82%A
